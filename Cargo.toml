[package]
name = "fluxpeer-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "fluxpeer desktop client — iced GUI over the local daemon control API"

# Build artifact stays lowercase `fluxpeer-desktop` to avoid colliding with the
# `fluxpeer` CLI on case-INSENSITIVE filesystems (macOS APFS): "Fluxpeer" == "fluxpeer".
# The user-facing name is "Fluxpeer" (window title + .app CFBundleName/Executable).
[[bin]]
name = "fluxpeer-desktop"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
tokio = { version = "1", features = ["net", "io-util", "rt"] }
serde_json = "1"
rfd = "0.15"
tray-icon = "0.19"
resvg = "0.42"
# wg.conf parsing + the control-server client (admin import of a WireGuard config).
fluxpeer-sdk = { git = "https://github.com/fluxpeer/fluxpeer" }
